name: Weekly superstock scan

on:
  schedule:
    - cron: "17 7 * * 6"   # Saturdays 07:17 UTC, after the US Friday close
    - cron: "17 13 * * 6"  # backup if GitHub skipped the first one
    - cron: "17 7 * * 0"   # second backup, Sunday morning
  workflow_dispatch:        # lets you press "Run workflow" any time

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # always use the latest code and data, even on a re-run
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python screener.py
      - name: Publish results
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs
          git commit -m "Weekly scan $(date -u +%F)" || echo "No changes"
          git pull --rebase -X theirs
          git push
