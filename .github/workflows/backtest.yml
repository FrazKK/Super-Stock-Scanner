name: Replay days (day trader)

# Replays past US trading days with the day-trader rules and saves each result to docs/data/backtest-*.json,
# totals to backtest-summary.json, plus one phone alert at the end. It never touches Trading 212.
# Strategies: breakout (one trade a day on an opening-range breakout), breakout-market (the same, but only when
# the US market is up on the day), breakout-strong (only stocks that traded a full normal day's volume in the
# first 30 minutes, top 3), drift (news in the last 5 days, closed up yesterday, above today's open at 10:00)
# and rotation (the earlier swap-to-the-strongest rules).
# 1-minute bars cover about the last 30 days; 5-minute bars about the last 60 days.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Days: one date, a list (2026-10-27, 2026-10-28) or a range (2026-10-05 to 2026-10-30). Blank = last 10 weekdays"
        required: false
        default: ""
      strategy:
        description: "Which strategy to replay"
        type: choice
        options:
          - "all"
          - "breakout"
          - "breakout-market"
          - "breakout-strong"
          - "catalyst"
          - "drift"
          - "rotation"
        default: "all"
      bars:
        description: "Price detail (5-minute lets you go back ~60 days)"
        type: choice
        options:
          - "1-minute"
          - "5-minute"
        default: "1-minute"
      trend:
        description: "Must stocks be in an uptrend (above their 20/50-day averages)?"
        type: choice
        options:
          - "required"
          - "not required"
          - "both"
        default: "required"
      news:
        description: "Must stocks have positive news?"
        type: choice
        options:
          - "required"
          - "not required"
          - "both"
        default: "required"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: plan
        env:
          DATES: ${{ inputs.dates }}
          NEWS: ${{ inputs.news }}
          STRATEGY: ${{ inputs.strategy }}
          BARS: ${{ inputs.bars }}
          TREND: ${{ inputs.trend }}
        run: python backtest_plan.py

  replay:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.day }} ${{ matrix.strategy }} (news ${{ matrix.news }}, trend ${{ matrix.trend }}, ${{ matrix.bars }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay
        env:
          DAY: ${{ matrix.day }}
          NEWS: ${{ matrix.news }}
          STRAT: ${{ matrix.strategy }}
          BARS: ${{ matrix.bars }}
          TREND: ${{ matrix.trend }}
          REPLAY_BATCH: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          extra=""
          suffix="-$STRAT"
          if [ "$NEWS" = "not required" ]; then extra="--no-news"; suffix="$suffix-nonews"; fi
          if [ "$TREND" = "not required" ]; then extra="$extra --no-trend"; suffix="$suffix-notrend"; fi
          if [ "$BARS" = "5m" ]; then suffix="$suffix-5m"; fi
          python backtest.py --date "$DAY" --strategy "$STRAT" --bars "$BARS" $extra
          mkdir -p out
          cp "docs/data/backtest-$DAY$suffix.json" out/ || echo "no result file"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ strategy.job-index }}
          path: out/*.json
          if-no-files-found: warn
          retention-days: 3

  save:
    needs: [plan, replay]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: docs/data
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Add up the results
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python backtest_summary.py
      - name: Save
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs/data/backtest-*.json
          git commit -m "Replays $(date -u +%F)" || echo "No changes"
          git pull --rebase -X theirs
          git push
