name: Evaluate stocks

on:
  workflow_dispatch:
    inputs:
      add:
        description: "Tickers to add, e.g. KOO:uk, TSLA:us, ABC:ca"
        required: false
        default: ""
      remove:
        description: "Tickers to remove, same format"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate
        env:
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python screener.py --evaluate --add "$ADD" --remove "$REMOVE"
      - name: Save
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs
          git commit -m "Evaluate $(date -u +%F)" || echo "No changes"
          git pull --rebase -X theirs
          git push
