name: Day trader (practice account)

# Trades the Trading 212 PRACTICE account through the US session, one stock at a time (see practice.py).
# The opening check starts it. The timer below is only a backup that restarts it if it isn't running.

on:
  schedule:
    - cron: "*/10 13-20 * * 1-5"     # backup only: starts the trader if it isn't running (from 10:00 New York)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - id: due
        run: python daytrade_due.py
      - if: steps.due.outputs.due == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.due.outputs.due == 'true'
        run: pip install -r requirements.txt
      - if: steps.due.outputs.due == 'true'
        name: Trade
        env:
          T212_KEY: ${{ secrets.T212_KEY }}
          T212_SECRET: ${{ secrets.T212_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          python practice.py --daytrade
      - if: always() && steps.due.outputs.due == 'true'
        name: Save
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add docs
          git commit -m "Day trade $(date -u +%F)" || echo "No changes"
          git pull --rebase -X theirs
          git push
      - if: always() && hashFiles('.daytrade_resume') != ''
        name: Hand over to a fresh run (GitHub's 6-hour limit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daytrade.yml --ref main
